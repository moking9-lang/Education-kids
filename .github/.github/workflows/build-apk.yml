name: Build Arabic Letters APK

on:
workflow_dispatch:
push:
branches: [main]

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout
uses: actions/checkout@v4

  - name: Setup Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Setup Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.7'

  - name: Extract Project
    run: unzip -q ArabicLettersGame_Android_Project.zip

  - name: Build APK
    run: gradle -p ArabicLettersGame_Android :app:assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: Arabic-Letters-APK
      path: ArabicLettersGame_Android/app/build/outputs/apk/debug/app-debug.apk
